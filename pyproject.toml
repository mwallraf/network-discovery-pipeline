[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "network-discovery-pipeline"
version = "0.1.0"
description = "Daily SNMP network discovery pipeline around nmap: scan, parse, publish."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ndp = "ndp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ndp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
